services:
  redis:
    image: redis:7-alpine
    container_name: wh-redis
    ports:
      - "6389:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - wh-network

  minio:
    image: minio/minio:latest
    container_name: wh-minio
    ports:
      - "9010:9000"
      - "9011:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - wh-network

volumes:
  redis-data:
  minio-data:

networks:
  wh-network:
    driver: bridge
