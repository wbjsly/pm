server:
  port: 8080

spring:
  profiles:
    active: sqlite,dev
  application:
    name: wh-management-system
  redis:
    host: localhost
    port: 6379
    password:
    database: 0
    timeout: 3000
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
      shutdown-timeout: 100ms

flowable:
  process-definition-location-prefix: classpath:bpmn/

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.wh.entity
  global-config:
    db-config:
      id-type: assign_uuid
      logic-delete-field: delFlag
      logic-delete-value: '1'
      logic-not-delete-value: '0'
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

app:
  jwt:
    secret: WhSecretKey2026ForJwtTokenGenerationAndValidation
    expiration: 86400000
  minio:
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin123
    bucket: wh-files
  sqlite:
    bootstrap:
      enabled: true
      location: classpath:db/sqlite/
      skip-scripts:

cost:
  warning:
    cron: "0 0 6 * * ?"
    threshold:
      info: 0.80
      warn: 0.95
      critical: 1.00
